name: Collect jobs

on:
  schedule:
    - cron: '17 5 * * *'   # every day, about 06:17 UK summer time
  workflow_dispatch: {}      # "Run workflow" button for an extra run

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect jobs (Reed, Adzuna, Jooble, Google Jobs via Apify; each kept inside its free limit)
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_jobs.py
      - name: Save the job list
        run: |
          git config user.name "cv-tailor-bot"
          git config user.email "cv-tailor-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Jobs: daily update"
          # The site may have been updated while the robot ran: fetch those changes first, then push (3 tries).
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
