name: Collect jobs

on:
  schedule:
    - cron: '17 5 * * *'   # every day, about 06:17 UK summer time
  workflow_dispatch: {}      # "Run workflow" button for an extra run

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect jobs from Reed and Adzuna
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Save the job list
        run: |
          git config user.name "cv-tailor-bot"
          git config user.email "cv-tailor-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Jobs: daily update"
          git push
