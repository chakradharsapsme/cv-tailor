<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Tailor</title>
<meta name="description" content="A personal job-search workspace: tailor a Word CV without moving the template, decide what to apply for, write letters and outreach, prepare for interviews and track every application.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/dashboard" aria-label="CV Tailor home">
      <span class="brand-mark" aria-hidden="true">CV</span>
      <span><span class="brand-name">CV Tailor</span><span class="brand-sub">S2P · P2P · Ariba · S/4HANA</span></span>
    </a>
    <a class="btn primary new-btn" href="#/new">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>New application
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-nav="dashboard"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Dashboard</a>
      <a href="#/pipeline" data-nav="pipeline"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="4" height="14" rx="1.2"/><rect x="8.5" y="3" width="4" height="10" rx="1.2"/><rect x="14" y="3" width="3" height="6" rx="1.2"/></svg>Pipeline <span class="badge" id="due-badge" hidden title="Actions due">0</span></a>
      <a href="#/profile" data-nav="profile"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/></svg>Career profile</a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <span class="pill" id="key-pill" data-state="missing">No API key</span>
      <p>Your data stays in this browser. Nothing is submitted without you.</p>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.5/dist/docx-preview.min.js"></script>
<script src="js/docx-engine.js"></script>
<script src="js/agent.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/autofill.js"></script>
<script src="js/views.js"></script>
<script src="js/workspace.js"></script>
<script src="js/app.js"></script>
</body>
</html>
